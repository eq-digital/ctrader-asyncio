[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ctrader-asyncio"
version = "0.0.1"
description = "A modern, asyncio-native Python client for the cTrader Open API"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jessica", email = "jessica@eq-digital.pro" }
]
keywords = ["ctrader", "trading", "asyncio", "openapi", "spotware"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Topic :: Office/Business :: Financial",
]
requires-python = ">=3.10"
dependencies = [
    "protobuf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "grpcio-tools>=1.50",
]

[project.urls]
Homepage = "https://github.com/eq-digital/ctrader-asyncio"
Repository = "https://github.com/eq-digital/ctrader-asyncio"
Issues = "https://github.com/eq-digital/ctrader-asyncio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
"ctrader_asyncio" = ["py.typed"]
